name: Deploy TSE Website Manager API to Production VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Website Manager API and Frontend
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Sync Code to Production VPS Current Directory
        run: |
          echo "Syncing code to /var/www/www-root/data/www/api-website-manager.thesearchequation.co.uk/current..."
          mkdir -p /var/www/www-root/data/www/api-website-manager.thesearchequation.co.uk/shared_db
          mkdir -p /var/www/www-root/data/www/api-website-manager.thesearchequation.co.uk/current
          rsync -avz --delete --no-p --no-t --no-o --no-g \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='shared_db' \
            --exclude='.env' \
            ./ /var/www/www-root/data/www/api-website-manager.thesearchequation.co.uk/current/

      - name: Install Dependencies and Build Frontend
        run: |
          cd /var/www/www-root/data/www/api-website-manager.thesearchequation.co.uk/current
          npm install
          npm run build

      - name: Deploy Frontend Dist to Web Roots
        run: |
          cd /var/www/www-root/data/www/api-website-manager.thesearchequation.co.uk/current
          for target_dir in \
            /var/www/www-root/data/www/tse-website-manager.thesearchequation.co.uk \
            /var/www/tse-website-manager.thesearchequation.co.uk \
            /opt/tse-apps/website-manager/dist \
            /opt/tse-apps/website-manager \
            /var/www/html; do
            if [ -d "$target_dir" ]; then
              echo "Deploying dist to $target_dir..."
              cp -r dist/* "$target_dir/" 2>/dev/null || true
            fi
          done
          NGINX_ROOT=$(grep -rh "root " /etc/nginx/ 2>/dev/null | grep "tse-website-manager" | head -n 1 | awk '{print $2}' | tr -d ';')
          if [ -n "$NGINX_ROOT" ] && [ -d "$NGINX_ROOT" ]; then
            echo "Deploying dist to NGINX root: $NGINX_ROOT..."
            cp -r dist/* "$NGINX_ROOT/" 2>/dev/null || true
          fi

      - name: Restart PM2 Service
        run: |
          pm2 restart website-manager-api || PERSISTENT_STORAGE_DIR=/var/www/www-root/data/www/api-website-manager.thesearchequation.co.uk/shared_db PORT=3005 pm2 start /var/www/www-root/data/www/api-website-manager.thesearchequation.co.uk/current/server/index.js --name website-manager-api --cwd /var/www/www-root/data/www/api-website-manager.thesearchequation.co.uk/current
          pm2 save

      - name: Verify Local API Health Endpoint
        run: |
          sleep 2
          curl -f -s http://localhost:3005/api/websites || (echo "Local health check failed!" && exit 1)

      - name: Verify Public HTTPS Health Endpoint
        run: |
          curl -f -s https://api-website-manager.thesearchequation.co.uk/api/websites || (echo "Public Websites endpoint failed!" && exit 1)
          curl -f -s https://api-website-manager.thesearchequation.co.uk/api/page-auditor-health || (echo "Public Page Auditor Proxy health check failed!" && exit 1)
